<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Kampuskeikat</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><a class="skip" href="#main">Siirry sisältöön</a>
<div id="auth" class="auth"><section class="auth-story"><div class="brand"><svg aria-label="Kampuskeikat" viewBox="0 0 32 32"><path d="M5 11h22v16H5zM10 11V7h12v4M10 17h12M10 22h7"/></svg><strong data-t="brand">Kampuskeikat</strong></div><div><h1 data-t="authHero">Käytännön työt yhdessä paikassa.</h1><p data-t="authIntro">Kaapelointi, laiteasennukset ja palvelintyöt – tehtävästä valmiiksi.</p></div><small>FastAPI · SQLite · Docker</small></section>
<section class="auth-form"><div class="auth-tools"><div class="langs"></div><button class="icon-btn" data-theme aria-label="Vaihda teemaa">◐</button></div><div class="seg"><button class="active" data-auth-tab="login" data-t="login">Kirjaudu</button><button data-auth-tab="register" data-t="register">Rekisteröidy</button></div>
<form id="loginForm"><h2 data-t="login">Kirjaudu</h2><label><span data-t="email">Sähköposti</span><input name="email" type="email" autocomplete="username" required></label><label><span data-t="password">Salasana</span><input name="password" type="password" autocomplete="current-password" required></label><p class="form-error" role="alert"></p><button class="primary" data-t="login">Kirjaudu</button></form>
<form id="registerForm" hidden><h2 data-t="register">Rekisteröidy</h2><label><span data-t="name">Nimi</span><input name="name" autocomplete="name" required minlength="2"></label><label><span data-t="email">Sähköposti</span><input name="email" type="email" autocomplete="email" required></label><label><span data-t="group">Ryhmä</span><input name="group_name"></label><label><span data-t="invite">Ryhmän kutsukoodi</span><input name="invite_code" required></label><label><span data-t="password10">Salasana (vähintään 10 merkkiä)</span><input name="password" type="password" autocomplete="new-password" minlength="10" required></label><p class="form-error" role="alert"></p><button class="primary" data-t="register">Rekisteröidy</button></form></section></div>
<div id="app" class="app" hidden><header><div class="brand"><svg aria-label="Kampuskeikat" viewBox="0 0 32 32"><path d="M5 11h22v16H5zM10 11V7h12v4M10 17h12M10 22h7"/></svg><strong data-t="brand">Kampuskeikat</strong></div><div class="header-actions"><div class="langs"></div><button class="icon-btn" data-theme aria-label="Vaihda teemaa">◐</button><span id="userName"></span><button id="logout" class="text-btn" data-t="logout">Kirjaudu ulos</button></div></header>
<nav id="nav" aria-label="Päänavigaatio"></nav><main id="main" tabindex="-1"><div id="view"></div></main></div>
<dialog id="modal"><div class="modal"><header><h2 id="modalTitle"></h2><button class="icon-btn" data-close aria-label="Sulje">×</button></header><div id="modalBody"></div></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
